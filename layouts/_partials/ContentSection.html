{{ $section := .section }}
<section class="section">
  <div class="container container--md">

    {{ if $section.title }}
    <h2 class="">{{ $section.title }}</h2>
    {{ end }}
    {{ if $section.subtitle }}
    <h3 class="">{{ $section.subtitle }}</h3>
    {{ end }}
    {{ if $section.content }}
    <div class="">
      {{ partial "markdownify-block" $section.content }}
    </div>
    {{ end }}

  </div>
</section>
