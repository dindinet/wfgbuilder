{{ $section := .section }}
<div class="scroller container container--{{ $section.scrollerwidth }}" id="scroller{{ $section.scrollername }}" 
    data-hzd-slider="" 
    data-prev-arrow="#prev{{ $section.scrollername }}" 
    data-next-arrow="#next{{ $section.scrollername }}"
    {{ if $section.arrowkeys }}
    data-arrow-keys="{{ $section.arrowkeys }}"
    {{ end }}
    {{ if $section.scrollby }}
    data-scroll-by="{{ $section.scrollby }}"
    {{ end }}
    {{ if $section.visibleslides }}
    data-visible-slides="{{ $section.visibleslides }}"
    {{ end }}
    {{ if $section.arrowcolor }}
    data-arrow-color="{{ $section.arrowcolor }}"
    {{ end }} 
    {{ if $section.arrowhovercolor }}
    data-arrow-hover-color="{{ $section.arrowhovercolor }}"
    {{ end }}
    {{ if $section.arrowsposition }}
    data-arrows-position="{{ $section.arrowsposition }}"
    {{ end }}
    {{ if $section.arrowsinout }}
    data-arrows-in-out="{{ $section.arrowsinout }}"
    {{ end }}
    {{ if $section.displaypager }}
    data-pager-container="#{{ $section.scrollername }}-pager"
    {{ end }} 
    {{ if $section.nextvisible }}
    data-next-visible="{{ $section.nextvisible }}"
    {{ end }} 
    tabindex="0" 
    style="scroll-snap-type: x mandatory;">

    {{ range $section.scrollerimages }}
    <img src="{{ .scrollerimage }}" alt="{{ .scrollerimagealt }}"/>
    {{ end }}
    
</div>
<div class="scrollerarrows">
  <svg id="prev{{ $section.scrollername }}" fill="#000000" viewBox="0 0 32 32" version="1.1" xmlns="http://www.w3.org/2000/svg">
    <path d="M16 0c-8.837 0-16 7.163-16 16s7.163 16 16 16c8.837 0 16-7.163 16-16s-7.163-16-16-16zM16 30.032c-7.72 0-14-6.312-14-14.032s6.28-14 14-14 14 6.28 14 14-6.28 14.032-14 14.032zM23.010 14.989h-11.264l3.617-3.617c0.39-0.39 0.39-1.024 0-1.414s-1.024-0.39-1.414 0l-5.907 6.062 5.907 6.063c0.195 0.195 0.451 0.293 0.707 0.293s0.511-0.098 0.707-0.293c0.39-0.39 0.39-1.023 0-1.414l-3.68-3.68h11.327c0.552 0 1-0.448 1-1s-0.448-1-1-1z"></path>
</svg>
<svg id="next{{ $section.scrollername }}" fill="#000000" viewBox="0 0 32 32" version="1.1" xmlns="http://www.w3.org/2000/svg">
  <path d="M16 0c-8.836 0-16 7.163-16 16s7.163 16 16 16c8.837 0 16-7.163 16-16s-7.163-16-16-16zM16 30.032c-7.72 0-14-6.312-14-14.032s6.28-14 14-14 14 6.28 14 14-6.28 14.032-14 14.032zM16.637 9.957c-0.39 0.39-0.39 1.024 0 1.414l3.617 3.617h-11.264c-0.553 0-1 0.448-1 1s0.447 1 1 1h11.327l-3.68 3.68c-0.39 0.39-0.39 1.023 0 1.414 0.195 0.195 0.451 0.293 0.707 0.293s0.512-0.098 0.707-0.293l5.907-6.063-5.907-6.063c-0.391-0.39-1.023-0.39-1.415 0z"></path>
</svg>
</div>
{{ if $section.displaypager }}
<div id="{{ $section.scrollername }}-pager" class="navbtns"></div>
{{ end }}
