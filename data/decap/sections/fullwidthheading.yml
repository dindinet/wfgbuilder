name: FullWidthHeadingSection
label: Full Width Heading Section
summary: '{{fields.title}} - {{fields.subtitle}}'
widget: object
fields:
  - {label: Title, name: title, widget: string}
  - {label: 'Title Colour', name: titlecolour, widget: 'color', enableAlpha: true, allowInput: true, required: false }
  - {label: Subtitle, name: subtitle, widget: string}
  - {label: 'Subtitle position', name: subtitleposition, widget: select, options: ["above", "below"]}
  - {label: 'Subtitle Colour', name: subtitlecolour, widget: 'color', enableAlpha: true, allowInput: true, required: false }