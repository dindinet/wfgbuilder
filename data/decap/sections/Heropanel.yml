label: "HeroPanel Section"
name: "HeropanelSection"
widget: "object"
fields:
  - { label: "Heading", name: "heading", widget: "string" }
  - { label: "Description", name: "description", widget: "text" }
  - { label: "Primary Button Label", name: "primary_button_label", widget: "string" }
  - { label: "Primary Button URL", name: "primary_button_url", widget: "string" }
  - { label: "Secondary Button Label", name: "secondary_button_label", widget: "string" }
  - { label: "Secondary Button URL", name: "secondary_button_url", widget: "string" }
  - label: "Color Palette Cards"
    name: "color_palette"
    widget: "list"
    fields:
      - { label: "Color Modifier (CSS class suffix, e.g. coral, peach, cream, dark)", name: "color_modifier", widget: "string" }
      - { label: "Color Label", name: "color_label", widget: "string" }
      - { label: "Use Light Label Text", name: "light_label_text", widget: "boolean" }