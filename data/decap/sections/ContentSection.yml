name: ContentSection
label: (WFG) General Content
summary: '{{fields.title}}-{{fields.subtitle}}'
widget: object
fields:
  - {label: Title ,name: title,widget: string, required: false}
  - {label: Subtitle ,name: subtitle,widget: string, required: false}
  - {label: Content, name: content, widget: markdown, buttons: [bold, italic, link, heading-one, heading-two, heading-three, quote, bulleted-list, numbered-list]}